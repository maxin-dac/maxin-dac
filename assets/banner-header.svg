<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 260" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Bannière animée data (thème clair)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF9"/>
      <stop offset="1" stop-color="#EEF8F6"/>
    </linearGradient>
    <radialGradient id="glowY" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE4A0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFE4A0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowT" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B7DFD9" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#B7DFD9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2B544"/>
      <stop offset="0.5" stop-color="#247F82">
        <animate attributeName="stop-color" values="#247F82;#D96852;#247F82" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#D96852"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#17656B"/>
      <stop offset="1" stop-color="#247F82"/>
    </linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#B7DFD9" opacity="0.55"/>
    </pattern>
  </defs>


  <rect width="1200" height="260" fill="url(#dots)"/>
  <circle cx="170" cy="30" r="240" fill="url(#glowY)"/>
  <circle cx="1040" cy="230" r="280" fill="url(#glowT)"/>

  <!-- rubans fluides (boucles sans couture) -->
  <g fill="none" stroke-linecap="round">
    <path d="M0,150 C100,108 200,192 300,150 C400,108 500,192 600,150 C700,108 800,192 900,150 C1000,108 1100,192 1200,150 C1300,108 1400,192 1500,150 C1600,108 1700,192 1800,150" stroke="#B7DFD9" stroke-width="46" opacity="0.35">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="26s" repeatCount="indefinite"/>
    </path>
    <path d="M0,196 C150,168 250,224 400,196 C550,168 650,224 800,196 C950,168 1050,224 1200,196 C1350,168 1450,224 1600,196 C1750,168 1850,224 2000,196" stroke="#FFE4A0" stroke-width="30" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" from="-800 0" to="0 0" dur="34s" repeatCount="indefinite"/>
    </path>
    <path d="M0,110 C100,86 200,134 300,110 C400,86 500,134 600,110 C700,86 800,134 900,110 C1000,86 1100,134 1200,110 C1300,86 1400,134 1500,110 C1600,86 1700,134 1800,110" stroke="#FFDCD0" stroke-width="18" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="20s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- barres arrondies qui respirent -->
  <g>
    <rect x="984" y="176" width="16" height="44" rx="8" fill="#83C5BE" opacity="0.55">
      <animate attributeName="y" values="176;158;176" dur="3.4s" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" repeatCount="indefinite"/>
      <animate attributeName="height" values="44;62;44" dur="3.4s" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" repeatCount="indefinite"/>
    </rect>
    <rect x="1010" y="162" width="16" height="58" rx="8" fill="#B7DFD9" opacity="0.6">
      <animate attributeName="y" values="162;180;162" dur="2.8s" begin="0.4s" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" repeatCount="indefinite"/>
      <animate attributeName="height" values="58;40;58" dur="2.8s" begin="0.4s" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" repeatCount="indefinite"/>
    </rect>
    <rect x="1036" y="148" width="16" height="72" rx="8" fill="#F2B544" opacity="0.8">
      <animate attributeName="y" values="148;132;148" dur="3.8s" begin="0.8s" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" repeatCount="indefinite"/>
      <animate attributeName="height" values="72;88;72" dur="3.8s" begin="0.8s" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" repeatCount="indefinite"/>
    </rect>
    <rect x="1062" y="168" width="16" height="52" rx="8" fill="#83C5BE" opacity="0.55">
      <animate attributeName="y" values="168;150;168" dur="3s" begin="1.1s" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" repeatCount="indefinite"/>
      <animate attributeName="height" values="52;70;52" dur="3s" begin="1.1s" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" repeatCount="indefinite"/>
    </rect>
    <rect x="1088" y="156" width="16" height="64" rx="8" fill="#F6A18A" opacity="0.6">
      <animate attributeName="y" values="156;172;156" dur="3.5s" begin="0.2s" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" repeatCount="indefinite"/>
      <animate attributeName="height" values="64;48;64" dur="3.5s" begin="0.2s" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" repeatCount="indefinite"/>
    </rect>
    <rect x="1114" y="142" width="16" height="78" rx="8" fill="#247F82" opacity="0.5">
      <animate attributeName="y" values="142;128;142" dur="3.2s" begin="0.6s" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" repeatCount="indefinite"/>
      <animate attributeName="height" values="78;92;78" dur="3.2s" begin="0.6s" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- sparkline secondaire (coral) -->
  <path pathLength="1000" d="M60,196 L200,178 L340,190 L480,160 L620,172 L760,142 L900,154 L1040,128 L1140,136" fill="none" stroke="#F6A18A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" stroke-dasharray="1000" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="1000;0;0" keyTimes="0;0.75;1" dur="9s" repeatCount="indefinite"/>
  </path>

  <!-- sparkline principale (teal dégradé) qui se trace -->
  <path id="spark1" pathLength="1000" d="M60,150 L180,120 L300,138 L420,96 L540,112 L660,70 L780,88 L900,52 L1020,66 L1140,34" fill="none" stroke="url(#spark)" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1000" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="1000;0;0" keyTimes="0;0.7;1" dur="7s" repeatCount="indefinite"/>
  </path>

  <!-- point voyageur -->
  <circle r="5" fill="#D96852" stroke="#FFFDF9" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.92;1" dur="7s" repeatCount="indefinite"/>
    <animateMotion dur="7s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.7;1" calcMode="linear">
      <mpath href="#spark1" xlink:href="#spark1"/>
    </animateMotion>
  </circle>

  <!-- nœuds pulsants -->
  <g fill="#FFFDF9" stroke="#247F82" stroke-width="2">
    <circle cx="420" cy="96" r="3.5">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="660" cy="70" r="3.5">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="52" r="3.5">
      <animate attributeName="r" values="3.5;5.5;3.5" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
  </g>


</svg>