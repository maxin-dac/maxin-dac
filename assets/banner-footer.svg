<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Pied de page animé (thème clair)">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEF8F6"/>
      <stop offset="1" stop-color="#FFFDF9"/>
    </linearGradient>
    <linearGradient id="frule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2B544"/>
      <stop offset="0.5" stop-color="#247F82">
        <animate attributeName="stop-color" values="#247F82;#D96852;#247F82" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#D96852"/>
    </linearGradient>
    <pattern id="fdots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#B7DFD9" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="120" fill="url(#fbg)"/>
  <rect width="1200" height="120" fill="url(#fdots)"/>

  <!-- flux de données -->
  <g fill="none" stroke-linecap="round">
    <path d="M0,42 H1200" stroke="#D9E2E0" stroke-width="2"/>
    <path d="M0,42 H1200" stroke="#247F82" stroke-width="2.5" stroke-dasharray="70 1130" opacity="0.85">
      <animate attributeName="stroke-dashoffset" values="1200;0" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M0,60 H1200" stroke="#D9E2E0" stroke-width="2"/>
    <path d="M0,60 H1200" stroke="#F2B544" stroke-width="2.5" stroke-dasharray="110 1090" opacity="0.9">
      <animate attributeName="stroke-dashoffset" values="0;1200" dur="10s" repeatCount="indefinite"/>
    </path>
    <path d="M0,78 H1200" stroke="#D9E2E0" stroke-width="2"/>
    <path d="M0,78 H1200" stroke="#D96852" stroke-width="2.5" stroke-dasharray="50 1150" opacity="0.8">
      <animate attributeName="stroke-dashoffset" values="1200;0" dur="12s" begin="1s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- égaliseur discret -->
  <g fill="#83C5BE" opacity="0.7">
    <circle cx="1120" cy="60" r="3">
      <animate attributeName="cy" values="60;52;60" dur="2.4s" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" repeatCount="indefinite"/>
    </circle>
    <circle cx="1140" cy="60" r="3">
      <animate attributeName="cy" values="60;68;60" dur="2.8s" begin="0.3s" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" repeatCount="indefinite"/>
    </circle>
    <circle cx="1160" cy="60" r="3">
      <animate attributeName="cy" values="60;50;60" dur="3.1s" begin="0.6s" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect width="1200" height="4" fill="url(#frule)"/>
  <rect y="116" width="1200" height="4" fill="url(#frule)"/>
</svg>